[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arogyascribe-backend"
version = "0.1.0"
description = "ArogyaScribe B2B Healthcare SaaS API & Asynchronous Processing Engine"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.8,<3.0",
  "pydantic-settings>=2.5,<3.0",
  "email-validator>=2.2,<3.0",
  "sqlalchemy>=2.0,<3.0",
  "psycopg2-binary>=2.9.9,<3.0",
  "alembic>=1.13,<2.0",
  "argon2-cffi>=23.1.0,<24.0",
  "python-jose[cryptography]>=3.3.0,<4.0",
  "python-multipart>=0.0.12,<1.0",
  "celery[redis]>=5.4,<6.0",
  "redis>=5.0,<6.0",
  "boto3>=1.35,<2.0",
  "reportlab>=4.2,<5.0",
  "httpx>=0.27,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
  "pytest-asyncio>=0.24,<1.0",
  "pytest-cov>=5.0,<7.0",
  "ruff>=0.6,<1.0",
  "mypy>=1.11,<2.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = [
  "celery.*",
  "celery",
  "jose.*",
  "argon2.*",
  "boto3.*",
  "reportlab.*",
]
ignore_missing_imports = true
